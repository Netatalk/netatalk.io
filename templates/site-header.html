<script>
(function () {
  var bar = document.querySelector(".accent-bar");
  if (!bar || !bar.animate ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var SPEED = 110;        /* px per second, identical for every packet */
  var PX_PER_MM = 96 / 25.4;
  function spawnPacket(offset) {
    var p = document.createElement("span");
    p.className = "packet";
    bar.appendChild(p);
    var lead = 10 + offset; /* trailing packets start further back */
    p.animate(
      [
        { transform: "translateX(" + (-lead) + "px)", opacity: 0 },
        { transform: "translateX(0px)", opacity: 1, offset: lead / (bar.offsetWidth + lead) },
        { opacity: 1, offset: 0.96 },
        { transform: "translateX(" + bar.offsetWidth + "px)", opacity: 0 }
      ],
      { duration: ((bar.offsetWidth + lead) / SPEED) * 1000, easing: "linear" }
    ).onfinish = function () { p.remove(); };
  }
  function spawnCluster() {
    if (window.scrollY === 0) {
      var count = 1 + Math.floor(Math.random() * 4);
      var offset = 0;
      for (var i = 0; i < count; i++) {
        if (i) offset += (5 + Math.random() * 25) * PX_PER_MM;
        spawnPacket(offset);
      }
    }
    setTimeout(spawnCluster, 3000 + Math.random() * 15000);
  }
  /* packets fly only while the page rests at the top; scrolling pauses
     them in place so the sticky banner stays calm while reading, and
     they carry on from where they stopped on return to the top */
  window.addEventListener("scroll", function () {
    var method = window.scrollY > 0 ? "pause" : "play";
    bar.querySelectorAll(".packet").forEach(function (p) {
      p.getAnimations().forEach(function (a) { a[method](); });
    });
  }, { passive: true });
  setTimeout(spawnCluster, 500 + Math.random() * 3000);
})();
</script>
