name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - logo/**
      - LICENSE
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: >
      (github.event_name == 'push' && github.actor != 'dependabot[bot]' && github.actor != 'dependabot') || (github.event_name
      == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' && github.actor
      != 'dependabot')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libyaml-pp-perl \
            mandoc \
            pandoc \
            po4a

      - name: Install Doxygen
        env:
          DOXYGEN_VERSION: '1.18.0'
          DOXYGEN_SHA256: '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90'
        run: |
          archive="$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          release="Release_${DOXYGEN_VERSION//./_}"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/doxygen/doxygen/releases/download/${release}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "$DOXYGEN_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin/doxygen" --version

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build.sh

      - name: Deploy site
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGE_NAME }} --branch=${{ github.head_ref || github.ref_name }}

      - name: Access site
        if: steps.deploy.outputs.deployment-url != ''
        env:
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          if [ -n "$DEPLOYMENT_ALIAS_URL" ]; then
            printf 'Temporary URL: %s\n' "$DEPLOYMENT_ALIAS_URL"
          else
            printf 'No temporary URL available.\n'
          fi
